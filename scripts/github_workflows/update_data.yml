name: Daily Financial Data Update

on:
  schedule:
    # Run every Monday through Friday at 22:30 CET (21:30 UTC in winter / 20:30 UTC in summer)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Historical Quotes
        run: |
          python scripts/fetch_history.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ js/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily financial data update [$(date +'%Y-%m-%d')]" && git push)
